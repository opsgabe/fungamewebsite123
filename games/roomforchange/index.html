<!doctype html>
<html>
	<head>
		<title>Room for Change</title>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
			html, body {
				margin: 0;
				height: 100%;
				background: #000;
				overflow: hidden;
			}
			canvas {
				cursor: default;
				outline: none;
				display: block;
				/* Scale the fixed 960x640 canvas to fit whatever frame hosts it. */
				width: 100vw !important;
				height: 100vh !important;
				object-fit: contain;
				image-rendering: pixelated;
			}
		</style>
	</head>
	
	<body>
		<div align="center" id="embed-com.sturdyhelmetgames.roomforchange.GwtDefinition"></div>
		<script type="text/javascript" src="com.sturdyhelmetgames.roomforchange.GwtDefinition/com.sturdyhelmetgames.roomforchange.GwtDefinition.nocache.js?v=4"></script>
	</body>
	
	<script>
		// Clicking the game must give this page keyboard focus, so don't cancel
		// mousedown (that would keep focus wherever it was, e.g. an embedding page).
		var embed = document.getElementById('embed-com.sturdyhelmetgames.roomforchange.GwtDefinition');
		embed.addEventListener('mousedown', function(evt) {
			window.focus();
			evt.target.style.cursor = 'default';
		}, false);
		embed.addEventListener('mouseup', function(evt) {
			evt.target.style.cursor = '';
		}, false);

		// Keep game keys from scrolling the page (or a page embedding this one).
		window.addEventListener('keydown', function(evt) {
			if ([32, 37, 38, 39, 40].indexOf(evt.keyCode) !== -1) evt.preventDefault();
		}, false);
	</script>
</html>
