<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BananaBread Arena</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; object-fit: contain; cursor: crosshair; }
    #status {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px;
      background: #000; font-weight: 600;
    }
    #status[hidden] { display: none; }
    progress { width: min(320px, 80%); }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status"><span id="status-text">Downloading arena…</span><progress id="progress" hidden></progress></div>

  <script>
    // Embeddable BananaBread: same engine build as bb.html, minus the demo chrome.
    // Reports progress to the host page with postMessage({ source: 'bananabread', event }).
    var statusBox = document.getElementById('status');
    var statusText = document.getElementById('status-text');
    var progressEl = document.getElementById('progress');

    function postToHost(event) {
      if (window.parent !== window) window.parent.postMessage({ source: 'bananabread', event: event }, '*');
    }

    var Module = {
      preRun: [],
      postRun: [],
      print: function (text) { console.log(Array.prototype.slice.call(arguments).join(' ')); },
      printErr: function (text) { console.warn(Array.prototype.slice.call(arguments).join(' ')); },
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function (e) {
          e.preventDefault();
          statusText.textContent = 'The graphics context was lost. Reload the page to keep playing.';
          statusBox.hidden = false;
        });
        canvas.addEventListener('click', function () {
          if (canvas.requestPointerLock) canvas.requestPointerLock();
        });
        return canvas;
      })(),
      setStatus: function (text) {
        var m = text && text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          statusText.textContent = m[1].trim();
          progressEl.value = parseInt(m[2]);
          progressEl.max = parseInt(m[4]);
          progressEl.hidden = false;
        } else if (text) {
          statusText.textContent = text;
          progressEl.hidden = true;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Starting engine…');
      },
      onFullScreen: function () {},
    };

    window.onerror = function () {
      statusText.textContent = 'The arena failed to start. This game needs a browser with WebGL and WebAssembly.';
      statusBox.hidden = false;
      postToHost('error');
    };

    Module.desiredWidth = 800;
    Module.desiredHeight = 600;
    Module.autoexec = function () { Module.setStatus(''); };

    var lastFrags = -1;
    Module.postLoadWorld = function () {
      Module.tweakDetail();
      BananaBread.execute('sensitivity 10');
      BananaBread.execute('clearconsole');
      statusBox.hidden = true;
      postToHost('ready');
      setInterval(function () {
        var frags = parseInt(BananaBread.executeString('getfrags'), 10);
        if (!isNaN(frags) && frags !== lastFrags) {
          lastFrags = frags;
          postToHost('frags:' + frags);
        }
      }, 500);
    };

    window.addEventListener('message', function (e) {
      if (e.source !== window.parent || !e.data || e.data.target !== 'bananabread') return;
      if (e.data.release && document.exitPointerLock) document.exitPointerLock();
      if (e.data.echo && window.BananaBread && BananaBread.execute) {
        BananaBread.execute('echo "' + String(e.data.echo).replace(/["^]/g, '') + '"');
      }
    });
  </script>

  <script async src="js/api.js"></script>
  <script async src="js/zee.js"></script>
  <script async src="game/gl-matrix.js"></script>
  <script async src="game/setup_low.js"></script>
  <script async src="game/preload_base.js"></script>
  <script async src="game/preload_character.js"></script>
  <script async src="game/preload_low.js"></script>
  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'bb.wasm', true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function () {
      Module.wasmBinary = xhr.response;
      var script = document.createElement('script');
      script.src = 'bb.js';
      document.body.appendChild(script);
    };
    xhr.onerror = window.onerror;
    xhr.send(null);
  </script>
</body>
</html>
